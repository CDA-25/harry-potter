<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
  <header class="bg-white shadow">
    <div class="container mx-auto px-4">
      <nav class="flex items-center justify-between py-4">
        <div>
          <a href="index.html" class="text-2xl font-bold text-gray-800">Harry Potter API</a>
        </div>
        <div class="hidden md:flex items-center space-x-4">
          <a href="index.html" class="text-gray-600 hover:text-gray-800">Accueil</a>
          <a href="maisons.html" class="text-gray-600 hover:text-gray-800">Maisons</a>
          <a href="films.html" class="text-gray-600 hover:text-gray-800">Films</a>
          <a href="livres.html" class="text-gray-600 hover:text-gray-800">Livres</a>
        </div>
        <div class="md:hidden">
          <button id="menu-btn" class="text-gray-600 hover:text-gray-800 focus:outline-none">
            <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path>
            </svg>
          </button>
        </div>
      </nav>
      <div id="mobile-menu" class="hidden md:hidden">
        <a href="index.html" class="block py-2 px-4 text-sm text-gray-600 hover:bg-gray-100">Accueil</a>
        <a href="maisons.html" class="block py-2 px-4 text-sm text-gray-600 hover:bg-gray-100">Maisons</a>
        <a href="films.html" class="block py-2 px-4 text-sm text-gray-600 hover:bg-gray-100">Films</a>
        <a href="livres.html" class="block py-2 px-4 text-sm text-gray-600 hover:bg-gray-100">Livres</a>
      </div>
    </div>
  </header>
  <div class="container mx-auto p-4">
    <h1 class="text-4xl font-bold text-center my-8">Personnages dans Harry fait le trottoir</h1>
    <div class="text-center my-4">
      <label for="house-select" class="mr-2">Trier par maison:</label>
      <select id="house-select" class="p-2 rounded">
        <option value="all">Toutes les maisons</option>
      </select>
    </div>
    <div id="characters-container" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
      <!-- Les cartes des personnages seront injectées ici par le script.js -->
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
  <script>
    const menuBtn = document.getElementById('menu-btn');
    const mobileMenu = document.getElementById('mobile-menu');

    menuBtn.addEventListener('click', () => {
      mobileMenu.classList.toggle('hidden');
    });
  </script>
<footer class="bg-white shadow mt-8 py-4">
    <div class="container mx-auto px-4">
      <p class="text-center text-gray-600">
        &copy; Site réalisé pour la formation de concepteur d'application -
        <a href="https://taaazzz.be" target="_blank" class="text-blue-600 hover:underline">Taaazzz-prog</a>
      </p>
    </div>
  </footer>
</body>
</html>
