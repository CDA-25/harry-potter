<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/src/image/logoHP.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Harry Potter | Film</title>
  </head>
  <body class="bg-[#530404] text-white">

    <header id="header" class="bg-[#530404] pt-4 pb-0">
      <div id="nav"></div>
    </header>
    <h1 class="absolute text-3xl font-extrabold text-white -mt-100 ml-150">Bienvenue dans le monde magique de Harry Potter !</h1>
    <div id="btn"></div>
    <div class="max-w-7xl mx-auto px-6 mt-6">
      <input
        id="search-films"
        type="text"
        placeholder="Rechercher un film..."
        class="w-full max-w-md ml-100 p-4 rounded bg-red-900 text-white border border-red-700 mb-10"
      />

      <div id="films-container" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-8 pb-20 ml-10"></div>
    </div>

    <div class="fixed bottom-5 right-5 flex flex-col gap-3">
      <button id="scroll-top" class="bg-red-700 hover:bg-red-600 text-white font-semibold py-2 px-4 rounded-lg shadow-md transition-colors duration-200">Haut</button>
      <button id="scroll-middle" class="bg-red-700 hover:bg-red-600 text-white font-semibold py-2 px-4 rounded-lg shadow-md transition-colors duration-200">Milieu</button>
      <button id="scroll-bottom" class="bg-red-700 hover:bg-red-600 text-white font-semibold py-2 px-4 rounded-lg shadow-md transition-colors duration-200">Bas</button>
    </div>

    <script type="module" src="/src/main.ts"></script>
    <script type="module" src="/film.ts"></script>
  </body>
</html>
